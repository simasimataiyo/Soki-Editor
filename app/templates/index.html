<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soki Editor</title>
  <link rel="stylesheet" href="/static/css/main.css?v=2" />
  <link rel="icon" href="data:," />
</head>

<body>
  <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
  <div id="app">
    <!-- プロジェクト選択画面 -->
    <div id="project-selector" class="screen active">
      <header class="selector-header">
        <h1 class="app-title">Soki Editor</h1>
      </header>
      <main class="selector-body">
        <div class="projects-toolbar">
          <h2 class="projects-heading">Projects</h2>
          <div class="selector-header-actions">
            <button class="btn btn-tertiary" id="btn-open-project">プロジェクトを開く</button>
            <button class="btn btn-primary" id="btn-new-project">プロジェクトを作成</button>
          </div>
        </div>
        <div id="project-card-grid" class="project-card-grid"></div>
        <div>
          <!-- ここに設定画面に飛ぶボタンを設ける -->
        </div>
      </main>
    </div>

    <!-- メインエディタ画面 -->
    <div id="editor-screen" class="screen">
      <!-- サイドバーナビゲーション -->
      <nav class="sidebar" id="sidebar" role="navigation" aria-label="メインナビゲーション">

        <ul class="sidebar-nav" role="menubar">
          <li role="none">
            <button class="nav-item active" data-tab="edit" role="menuitem" aria-label="編集タブ" aria-current="page"
              title="Edit">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" />
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
              </svg>
              <span class="nav-label">Edit</span>
            </button>
          </li>
          <li role="none">
            <button class="nav-item" data-tab="source" role="menuitem" aria-label="ソースタブ" title="Source">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
              <span class="nav-label">Sources</span>
            </button>
          </li>
          <li role="none">
            <button class="nav-item" data-tab="material" role="menuitem" aria-label="マテリアルタブ" title="Material">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
              <span class="nav-label">Material</span>
            </button>
          </li>
          <li role="none">
            <button class="nav-item" data-tab="rule" role="menuitem" aria-label="ルールタブ" title="Rule">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" />
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                <line x1="8" y1="12" x2="16" y2="12" />
                <line x1="8" y1="16" x2="12" y2="16" />
              </svg>
              <span class="nav-label">Rules</span>
            </button>
          </li>
        </ul>
        <div class="sidebar-bottom">
          <div class="nav-item" id="btn-back" title="プロジェクト選択に戻る">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span class="nav-label">Back</span>
          </div>
          <button class="nav-item" data-tab="settings" role="menuitem" aria-label="設定タブ" title="Settings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
            </svg>
            <span class="nav-label">Settings</span>
          </button>
        </div>
      </nav>

      <!-- エディタ本体（トップバー + メインコンテンツ） -->
      <div class="editor-body">
        <!-- トップヘッダーバー -->
        <header class="top-bar" id="top-bar">
          <div class="top-bar-left">
            <span id="project-name-display"></span>
            <!-- <span id="save-status" class="save-indicator saved">保存済み</span> -->
          </div>
          <div class="top-bar-right" style="display: flex; align-items: center; gap: 8px;">
            <div id="top-bar-actions" style="display: flex; gap: 8px;"></div>
            <button class="btn btn-secondary btn-sm" id="btn-export-md" title="Markdownエクスポート"
              style="display: flex; align-items: center; justify-content: center; line-height: 1;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                style="margin-right: 4px;">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Export
            </button>
          </div>
          <span id="char-count-display" class="char-count-display" style="display:none"></span>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content" id="main-content">
          <!-- Edit タブ -->
          <div class="tab-pane active" id="tab-edit">
            <div class="two-pane">
              <!-- 左パネル: アウトライン -->
              <aside class="left-panel" id="outline-panel">
                <div class="panel-header">
                  <span>Outline</span>
                </div>
                <button class="btn-add-item" id="btn-add-chapter">セクション追加</button>
                <ul class="outline-list" id="outline-list"></ul>
                <div class="outline-references" id="outline-references">
                  <span class="outline-references-label">
                    <span class="icon">≡</span> 参考文献
                  </span>
                  <label class="toggle-switch mini" title="参考文献リストの自動生成を有効化">
                    <input type="checkbox" id="references-section-enabled" />
                    <span class="slider"></span>
                  </label>
                </div>
              </aside>
              <!-- 右メインエリア: ドキュメントビュー -->
              <div class="doc-view" id="doc-view">
                <div id="tiptap-toolbar" class="tiptap-toolbar">
                  <button class="btn-toolbar" data-action="bold" title="太字 (Ctrl+B)"><b>B</b></button>
                  <button class="btn-toolbar" data-action="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
                  <button class="btn-toolbar" data-action="strike" title="取り消し線 (Ctrl+Shift+X)"><s>S</s></button>
                  <button class="btn-toolbar" data-action="code"
                    title="インラインコード (Ctrl+E)"><code>&lt;/&gt;</code></button>
                  <div id="tiptap-toolbar-divider" class="toolbar-divider"></div>
                  <span id="tiptap-toolbar-label" class="tiptap-toolbar-label"></span>
                  <button class="btn btn-sm btn-secondary" data-action="insert-ref">文献挿入</button>
                  <button class="btn btn-sm btn-secondary" data-action="insert-fig">図表挿入</button>
                </div>
                <div id="tiptap-editor-mount"></div>
              </div>
            </div>
            <!-- チャット入力バー -->
            <div class="chat-bar" id="chat-bar">
              <!-- チャット履歴インラインパネル（折りたたみ可能） -->
              <div class="chat-history-panel" id="chat-history-panel" style="display:none">
                <!-- <div style="display: flex; justify-content:flex-end; padding: 0 24px;">
                  <button class="btn btn-secondary btn-sm" id="btn-chat-history" title="チャット履歴を開閉">
                    閉じる
                  </button>
                </div> -->
                <div class="chat-history-panel-tabs" id="chat-history-panel-tabs"></div>
                <div class="chat-history-panel-messages" id="chat-history-panel-messages">
                  <p class="chat-history-placeholder">スコープを選択してください</p>
                </div>
              </div>
              <div class="chat-resize-handle" id="chat-resize-handle" title="ドラッグで高さ調整"></div>

              <div style="padding: 12px 24px;">
                <div class="chat-textarea-wrapper">
                  <textarea id="chat-input" class="chat-textarea" placeholder="What would you like to know?"
                    rows="3"></textarea>
                </div>
                <div class="chat-controls">
                  <button class="btn-icon btn-send" id="btn-chat-send" title="送信"><svg viewBox="0 0 16 16" width="16"
                      height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round">
                      <line x1="8" y1="13" x2="8" y2="3" />
                      <polyline points="4,7 8,3 12,7" />
                    </svg></button>
                </div>
              </div>
            </div>
          </div>

          <!-- Source タブ -->
          <div class="tab-pane" id="tab-source">
            <div class="two-pane">
              <aside class="left-panel" id="source-panel">
                <div class="panel-header">
                  <span>Sources</span>
                </div>
                <button class="btn-add-item" id="btn-add-source">新規追加</button>
                <ul class="item-list" id="source-list"></ul>
              </aside>
              <div class="detail-pane" id="source-detail">
                <p class="placeholder-text">ソースを選択してください</p>
              </div>
            </div>
          </div>

          <!-- Material タブ -->
          <div class="tab-pane" id="tab-material">
            <div class="two-pane">
              <aside class="left-panel" id="material-panel">
                <div class="panel-header">
                  <span>Material</span>
                </div>
                <button class="btn-add-item" id="btn-add-material">新規追加</button>
                <ul class="material-card-list" id="material-list"></ul>
              </aside>
              <div class="detail-pane" id="material-detail">
                <p class="placeholder-text">マテリアルを選択してください</p>
              </div>
            </div>
          </div>

          <!-- Rule タブ -->
          <div class="tab-pane" id="tab-rule">
            <div class="two-pane">
              <aside class="left-panel" id="rule-panel">
                <div class="panel-header">
                  <span>Rules</span>
                </div>
                <button class="btn-add-item" id="btn-add-rule-from-panel">新規追加</button>
                <ul class="rule-tree" id="category-list"></ul>
              </aside>
              <div class="detail-pane" id="rule-detail" style="padding:24px 32px;overflow-y:auto">
                <div class="rule-all-view" id="rule-all-view"></div>
              </div>
            </div>
          </div>

          <!-- Settings タブ -->
          <div class="tab-pane" id="tab-settings">
            <div class="two-pane">
              <aside class="left-panel" id="settings-panel">
                <div class="panel-header">
                  <span>Settings</span>
                </div>
              </aside>
              <div class="detail-pane" id="settings-detail">
                <div class="settings-container">
                  <h2>LLM 設定</h2>
                  <form id="settings-form" class="settings-form">
                    <div class="form-group">
                      <label for="settings-api-key">API キー</label>
                      <input type="password" id="settings-api-key" class="form-control" placeholder="sk-..." />
                    </div>
                    <div class="form-group">
                      <label for="settings-endpoint">エンドポイント URL</label>
                      <input type="url" id="settings-endpoint" class="form-control"
                        placeholder="未設定時は OpenAI デフォルトを使用" />
                    </div>
                    <div class="form-group">
                      <label for="settings-model">モデル名</label>
                      <input type="text" id="settings-model" class="form-control" placeholder="gpt-4o" />
                    </div>
                    <div class="form-group">
                      <label for="settings-pdf-dpi">PDF 等倍画像 DPI</label>
                      <input type="number" id="settings-pdf-dpi" class="form-control" placeholder="96" min="72"
                        max="300" style="max-width:120px" />
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                  </form>
                </div>
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <!-- モーダル: 新規プロジェクト -->
  <div class="modal-overlay" id="modal-new-project" role="dialog" aria-modal="true"
    aria-labelledby="modal-new-project-title" style="display:none">
    <div class="modal">
      <h3 id="modal-new-project-title">新規プロジェクト作成</h3>
      <div class="form-group">
        <label>プロジェクト名</label>
        <input type="text" id="new-project-name" class="form-control" placeholder="プロジェクト名" />
      </div>
      <div class="form-group">
        <label>保存先 (.json)</label>
        <div class="input-with-btn">
          <input type="text" id="new-project-path" class="form-control" placeholder="保存先を選択または入力..." />
          <button class="btn btn-secondary btn-sm" id="btn-select-json-path">選択</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-cancel-new-project">キャンセル</button>
        <button class="btn btn-primary" id="btn-confirm-new-project">作成</button>
      </div>
    </div>
  </div>

  <!-- モーダル: ディレクトリブラウザ（ブラウザモード用保存先選択） -->
  <div class="modal-overlay" id="modal-file-browser" style="display:none">
    <div class="modal modal-lg">
      <h3>保存先を選択</h3>
      <div class="file-browser-bar">
        <button class="btn btn-secondary btn-sm" id="btn-fb-up" title="上の階層へ">&#8593; 上へ</button>
        <div class="file-browser-path" id="fb-current-path"></div>
      </div>
      <div class="file-browser-list" id="fb-list"></div>
      <div class="form-group">
        <label>ファイル名</label>
        <input type="text" id="fb-filename" class="form-control" value="project.json" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-fb-cancel">キャンセル</button>
        <button class="btn btn-primary" id="btn-fb-select">選択</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JavaScript -->
  <script src="/static/js/api-client.js"></script>
  <script src="/static/js/state-manager.js"></script>
  <script src="/static/js/undo-redo-manager.js"></script>
  <script src="/static/js/modal.js"></script>
  <script src="/static/js/project-selector.js"></script>
  <script type="module" src="/static/js/tiptap-bundle.js?v=4"></script>
  <script src="/static/js/edit-tab.js?v=4"></script>
  <script src="/static/js/source-tab.js"></script>
  <script src="/static/js/material-tab.js"></script>
  <script src="/static/js/rule-tab.js"></script>
  <script src="/static/js/command-parser.js"></script>
  <script src="/static/js/autocomplete-popup.js"></script>
  <script src="/static/js/chat-bar-common.js"></script>
  <script src="/static/js/settings-tab.js"></script>
  <script src="/static/js/app.js"></script>
</body>

</html>
